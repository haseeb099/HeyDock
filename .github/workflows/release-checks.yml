name: Release checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Preview build (noindex unless HEYDOCK_PUBLIC=1)
        run: npm run build
      - name: Tests (enquiry + site audit)
        run: npm test
      - name: Public build must fail without registration jurisdiction
        run: |
          set +e
          HEYDOCK_PUBLIC=1 HEYDOCK_ORIGIN=https://hdocks.com HEYDOCK_REGISTRATION_JURISDICTION= npm run build
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected the public build to fail when HEYDOCK_REGISTRATION_JURISDICTION is empty" >&2
            exit 1
          fi
      - name: Public production fixture
        env:
          HEYDOCK_PUBLIC: "1"
          HEYDOCK_ORIGIN: https://hdocks.com
        run: |
          npm run build
          grep -q 'HeyDock is a trading name of' dist/contact/index.html
          grep -q 'id="company-details"' dist/contact/index.html
          grep -R --include='*.html' -l 'href="/contact#company-details"' dist | grep -q .
          grep -q 'Allow: /' dist/robots.txt
          grep -q 'Sitemap: https://hdocks.com/sitemap-index.xml' dist/robots.txt
          grep -q 'index, follow' dist/index.html
          ! grep -R --include='*.html' -E 'href="[^"]+\.html|src="[^"]+\.html' dist
